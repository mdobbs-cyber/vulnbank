version: '3.8'

services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - ledger-service
      - frontend-service

  frontend-service:
    build: ./services/frontend
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Better for Windows/Docker dev

  auth-service:
    build: ./services/auth
    environment:
      - DATABASE_URL=postgresql://user:password@db/bank_db

  ledger-service:
    build: ./services/ledger
    environment:
      - DATABASE_URL=postgresql://user:password@db/bank_db

  transaction-worker:
    build: ./services/worker
    deploy:
      replicas: 2
    environment:
      - DATABASE_URL=postgresql://user:password@db/bank_db
    depends_on:
      - rabbitmq
      - db

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=bank_db # Default DB, others can be created via init script
    volumes:
      - pg-data:/var/lib/postgresql/data
      # We will add init scripts later for multiple DBs

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  pg-data:
  redis-data: # Placeholder if we add Redis later, but skipping for minimal scaffold as per specific instructions (User didn't ask for Redis in this strict list, but mentioned it in overall context. I will stick to the strict list for this prompt.)
