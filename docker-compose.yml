version: '3.8'

services:
  gateway:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./services/gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - ledger-service
      - frontend-service

  frontend-service:
    build: ./services/frontend
    volumes:
      - ./services/frontend:/app
      - /app/node_modules
    ports:
      - "3000:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Better for Windows/Docker dev

  auth-service:
    build: ./services/auth
    environment:
      - DATABASE_URL=postgresql://user:password@db/bank_db

  ledger-service:
    build: ./services/ledger
    environment:
      - DATABASE_URL=postgresql://user:password@db/bank_db

  transaction-worker:
    build: ./services/worker
    deploy:
      replicas: 2
    environment:
      - DATABASE_URL=postgresql://user:password@db/bank_db
    depends_on:
      - rabbitmq
      - db

  status-dashboard:
    build: ./services/status-dashboard
    volumes:
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
    ports:
      - "8081:8000"

  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=bank_db # Default DB, others can be created via init script
    volumes:
      - pg-data:/var/lib/postgresql/data
      # We will add init scripts later for multiple DBs

  rabbitmq:
    image: rabbitmq:3-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672"

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  splunk:
    image: splunk/splunk:latest
    environment:
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=password123
      - SPLUNK_OPTIMISTIC_ABOUT_FILE_LOCKING=1
    ports:
      - "8000:8000"
      - "8088:8088"
      - "9997:9997"
    volumes:
      - splunk-etc:/opt/splunk/etc
      - splunk-var:/opt/splunk/var
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          memory: 2G

  splunk-forwarder:
    image: splunk/universalforwarder:latest
    user: root
    environment:
      - SPLUNK_GENERAL_TERMS=--accept-sgt-current-at-splunk-com
      - SPLUNK_START_ARGS=--accept-license
      - SPLUNK_PASSWORD=password123
      - SPLUNK_STANDALONE_URL=splunk:9997
      - SPLUNK_USER=root
    volumes:
      - ${DOCKER_CONTAINERS_PATH:-/var/lib/docker/containers}:/var/lib/docker/containers:ro
      - ${DOCKER_SOCK_PATH:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - ./config/splunk/vulnbank_config:/opt/splunkforwarder/etc/apps/vulnbank_config
    depends_on:
      - splunk

volumes:
  pg-data:
  redis-data:
  splunk-etc:
  splunk-var:
